<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="GitQuest — apprends Git en voyant le graphe">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12151a"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a45" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect x="0" y="0" width="1280" height="2" fill="url(#glow)"/>

  <!-- Glyphe GitQuest -->
  <g transform="translate(72 66)" fill="none" stroke="#ff7a45" stroke-width="4" stroke-linecap="round">
    <path d="M6 34 L34 6"/>
    <circle cx="8" cy="36" r="7" fill="#12151a"/>
    <circle cx="36" cy="36" r="7" fill="#12151a"/>
    <circle cx="36" cy="8" r="7" fill="#12151a"/>
    <path d="M15 36 H29" stroke-width="4"/>
    <path d="M36 15 V29" stroke-width="4"/>
  </g>

  <text x="72" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="86" fill="#f4f1ea" letter-spacing="-1">GitQuest</text>
  <text x="75" y="221" font-family="Menlo, Consolas, monospace" font-size="15" fill="#ff9d73" letter-spacing="3">APPRENDRE GIT PAR LA PRATIQUE</text>
  <text x="75" y="262" font-family="Georgia, serif" font-size="21" fill="#a7b0ba">Terminal simulé, graphe animé : chaque commande devient visible.</text>
  <text x="75" y="322" font-family="Menlo, Consolas, monospace" font-size="13" fill="#6f7a86">6 chapitres  ·  19 missions  ·  PWA hors ligne  ·  zéro backend</text>

  <!-- Graphe décoratif -->
  <g transform="translate(760 70)">
    <line x1="0" y1="130" x2="440" y2="130" stroke="#5b6470" stroke-width="3"/>
    <path d="M0 130 C 90 34, 210 34, 300 130" fill="none" stroke="#e85c8a" stroke-width="3"/>
    <path d="M300 130 C 350 130, 380 130, 440 130" fill="none" stroke="#57c7a1" stroke-width="3"/>
    <path d="M300 130 C 360 190, 400 190, 440 190" fill="none" stroke="#5b6470" stroke-width="3" stroke-dasharray="4 6"/>

    <circle cx="0" cy="130" r="9" fill="#12151a" stroke="#5b6470" stroke-width="3"/>
    <circle cx="300" cy="130" r="10" fill="#12151a" stroke="#ff7a45" stroke-width="4"/>
    <circle cx="150" cy="66" r="9" fill="#12151a" stroke="#e85c8a" stroke-width="3"/>
    <circle cx="440" cy="130" r="9" fill="#12151a" stroke="#57c7a1" stroke-width="3"/>
    <circle cx="440" cy="190" r="7" fill="#12151a" stroke="#5b6470" stroke-width="3"/>

    <g font-family="Menlo, Consolas, monospace" font-size="13">
      <rect x="316" y="112" width="54" height="24" rx="12" fill="#24313d" stroke="#57c7a1" stroke-opacity="0.5"/>
      <text x="327" y="129" fill="#9ae6cb">main</text>
      <rect x="128" y="44" width="132" height="24" rx="12" fill="#33222c" stroke="#e85c8a" stroke-opacity="0.5"/>
      <text x="140" y="61" fill="#ffa9c4">feature/login</text>
      <text x="0" y="164" fill="#6f7a86">racine</text>
      <text x="404" y="214" fill="#6f7a86">merge</text>
    </g>
  </g>
</svg>
